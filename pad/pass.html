<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etherpad Lite - Passkey Edition</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --input-bg: #2a2a2a;
      --button-bg: #3d3d3d;
      --button-hover: #4f4f4f;
      --accent: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px;
    }

    .top-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input, select, button {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .input-pad-name { flex: 2; min-width: 160px; }
    .input-duration { width: 70px; }
    .select-unit { width: 100px; }

    button {
      background: var(--button-bg);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--button-hover);
    }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .status-bar {
      font-size: 13px;
      color: var(--text-muted);
      min-height: 18px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 6px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .read-mode-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
    }

    .btn-copy {
      background: #2b522c;
      border-color: #3e7a40;
    }
    .btn-copy:hover {
      background: #386b3a;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- WRITE MODE TOP BAR -->
  <div id="writeBar" class="top-bar">
    <input type="text" id="padName" class="input-pad-name" placeholder="Pad Name (e.g. email-draft)">
    <input type="number" id="expiryDuration" class="input-duration" min="1" value="30">
    <select id="expiryUnit" class="select-unit">
      <option value="minutes">Minutes</option>
      <option value="hours">Hours</option>
      <option value="days">Days</option>
    </select>
    <button id="saveBtn">Save Pad</button>
    <button id="passkeyUnlockBtn" title="Unlock Config with Passkey">🔑 Unlock</button>
    <button id="settingsBtn" title="GitHub Settings">⚙️</button>
  </div>

  <!-- READ-ONLY MODE TOP BAR -->
  <div id="readBar" class="read-mode-bar">
    <span id="readTitle" style="font-weight: 600;">Reading Pad...</span>
    <div style="display: flex; gap: 8px;">
      <button id="copyBtn" class="btn-copy">Copy Text</button>
      <button id="newPadBtn">New Pad</button>
    </div>
  </div>

  <!-- EDITOR AREA -->
  <div class="editor-area">
    <textarea id="padText" placeholder="Write your text here..."></textarea>
  </div>

  <div id="statusBar" class="status-bar">Ready</div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h3 style="font-size: 16px;">GitHub & Passkey Configuration</h3>
    <input type="text" id="repoOwner" placeholder="GitHub Username">
    <input type="text" id="repoName" placeholder="Private Orchestration Repo">
    <input type="password" id="patToken" placeholder="PAT (scopes: gist, repo)">
    <button id="registerPasskeyBtn">Register Passkey & Save</button>
    <button id="saveSettingsBtn" style="background: #2a2a2a;">Save Plain (No Passkey)</button>
  </div>
</div>

<script>
  // In-memory runtime session config
  let sessionConfig = null;

  // Hashing and Encryption Functions
  async function hashName(name) {
    const msgUint8 = new TextEncoder().encode(name.trim().toLowerCase());
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 24);
  }

  async function encryptText(plainText, keyString) {
    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(keyString), { name: "PBKDF2" }, false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
    const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(plainText));
    const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
    combined.set(salt, 0); combined.set(iv, salt.length); combined.set(new Uint8Array(encrypted), salt.length + iv.length);
    return btoa(String.fromCharCode(...combined));
  }

  async function decryptText(cipherBase64, keyString) {
    const combined = new Uint8Array(atob(cipherBase64).split("").map(c => c.charCodeAt(0)));
    const salt = combined.slice(0, 16); const iv = combined.slice(16, 28); const data = combined.slice(28);
    const keyMaterial = await crypto.subtle.importKey("raw", new TextEncoder().encode(keyString), { name: "PBKDF2" }, false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    return new TextDecoder().decode(decrypted);
  }

  // WebAuthn Passkey Secret Derivation (PRF extension)
  const prfSalt = new TextEncoder().encode("Etherpad-Passkey-Salt-v1");

  async function derivePasskeyKey() {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const credIdBase64 = localStorage.getItem('passkey_cred_id');
    
    if (!credIdBase64) throw new Error("No Passkey registered yet on this device.");

    const rawId = Uint8Array.from(atob(credIdBase64), c => c.charCodeAt(0));

    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ type: "public-key", id: rawId }],
        userVerification: "required",
        extensions: { prf: { eval: { first: prfSalt } } }
      }
    });

    const prfResults = assertion.getClientExtensionResults().prf;
    if (!prfResults || !prfResults.results || !prfResults.results.first) {
      throw new Error("Passkey PRF extension not supported by this authenticator.");
    }

    return new Uint8Array(prfResults.results.first);
  }

  // Register Passkey
  document.getElementById('registerPasskeyBtn').onclick = async () => {
    const owner = document.getElementById('repoOwner').value.trim();
    const repo = document.getElementById('repoName').value.trim();
    const token = document.getElementById('patToken').value.trim();

    if (!owner || !repo || !token) {
      alert("Please fill in Owner, Repo, and PAT before registering.");
      return;
    }

    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = crypto.getRandomValues(new Uint8Array(16));

      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: "Etherpad App" },
          user: { id: userId, name: owner, displayName: owner },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: { userVerification: "required", residentKey: "preferred" },
          extensions: { prf: { eval: { first: prfSalt } } }
        }
      });

      const rawId = new Uint8Array(cred.rawId);
      const credIdBase64 = btoa(String.fromCharCode(...rawId));
      localStorage.setItem('passkey_cred_id', credIdBase64);

      // Extract PRF Secret Key
      const prfResults = cred.getClientExtensionResults().prf;
      let passkeyKey;
      if (prfResults && prfResults.enabled && prfResults.results && prfResults.results.first) {
        passkeyKey = new Uint8Array(prfResults.results.first);
      } else {
        // Fallback: derive key from Credential ID if PRF isn't enabled by hardware driver
        passkeyKey = await crypto.subtle.digest("SHA-256", rawId);
      }

      // Encrypt config payload using Derived Key
      const rawPayload = JSON.stringify({ owner, repo, token });
      const passkeyKeyString = btoa(String.fromCharCode(...new Uint8Array(passkeyKey)));
      const encryptedConfig = await encryptText(rawPayload, passkeyKeyString);

      localStorage.setItem('encrypted_gh_config', encryptedConfig);
      sessionConfig = { owner, repo, token };

      modal.style.display = 'none';
      statusEl.innerText = "Passkey registered and config encrypted!";
    } catch (err) {
      alert(`Passkey registration error: ${err.message}`);
    }
  };

  // Unlock with Passkey Button
  document.getElementById('passkeyUnlockBtn').onclick = async () => {
    try {
      statusEl.innerText = "Touch biometric sensor...";
      const passkeyKey = await derivePasskeyKey();
      const passkeyKeyString = btoa(String.fromCharCode(...passkeyKey));
      
      const encryptedConfig = localStorage.getItem('encrypted_gh_config');
      if (!encryptedConfig) throw new Error("No encrypted config found in localStorage.");

      const decryptedPayload = await decryptText(encryptedConfig, passkeyKeyString);
      sessionConfig = JSON.parse(decryptedPayload);

      statusEl.innerText = "Unlocked via Passkey! Config loaded into memory.";
    } catch (err) {
      statusEl.innerText = `Unlock failed: ${err.message}`;
    }
  };

  const statusEl = document.getElementById('statusBar');
  const padText = document.getElementById('padText');
  const modal = document.getElementById('settingsModal');

  function getConfig() {
    if (sessionConfig) return sessionConfig;
    return {
      owner: localStorage.getItem('gh_owner') || '',
      repo: localStorage.getItem('gh_repo') || '',
      token: localStorage.getItem('gh_token') || ''
    };
  }

  document.getElementById('settingsBtn').onclick = () => {
    const c = getConfig();
    document.getElementById('repoOwner').value = c.owner;
    document.getElementById('repoName').value = c.repo;
    document.getElementById('patToken').value = c.token;
    modal.style.display = 'flex';
  };

  document.getElementById('saveSettingsBtn').onclick = () => {
    const owner = document.getElementById('repoOwner').value.trim();
    const repo = document.getElementById('repoName').value.trim();
    const token = document.getElementById('patToken').value.trim();
    localStorage.setItem('gh_owner', owner);
    localStorage.setItem('gh_repo', repo);
    localStorage.setItem('gh_token', token);
    sessionConfig = { owner, repo, token };
    modal.style.display = 'none';
    statusEl.innerText = "Plain config saved.";
  };

  // ROUTER for Phone/Read mode
  async function initRouter() {
    const rawPadName = decodeURIComponent(window.location.hash.substring(1)).trim();
    if (!rawPadName) return;

    document.getElementById('writeBar').classList.add('hidden');
    document.getElementById('readBar').style.display = 'flex';
    document.getElementById('readTitle').innerText = `Pad: ${rawPadName}`;
    padText.readOnly = true;
    padText.placeholder = "Loading & decrypting pad...";

    statusEl.innerText = "Locating pad Gist...";

    try {
      const padHash = await hashName(rawPadName);
      const searchFilename = `pad_${padHash}.encrypted`;

      let owner = getConfig().owner;
      if (!owner) {
        owner = prompt("Enter your GitHub Username to load this pad:");
        if (owner) localStorage.setItem('gh_owner', owner.trim());
      }

      const gistsRes = await fetch(`https://api.github.com/users/${owner}/gists?per_page=100`);
      if (!gistsRes.ok) throw new Error("Could not retrieve Gists.");

      const gists = await gistsRes.json();
      const targetGist = gists.find(g => g.files && g.files[searchFilename]);
      if (!targetGist) throw new Error("Pad not found or expired.");

      const rawUrl = targetGist.files[searchFilename].raw_url;
      const contentRes = await fetch(rawUrl);
      const cipherText = await contentRes.text();

      statusEl.innerText = "Decrypting content...";
      const decrypted = await decryptText(cipherText, rawPadName);
      padText.value = decrypted;
      padText.readOnly = false;
      statusEl.innerText = "Pad loaded and decrypted!";
    } catch (err) {
      statusEl.innerText = `Error: ${err.message}`;
      padText.placeholder = err.message;
    }
  }

  // SAVE PAD
  document.getElementById('saveBtn').onclick = async () => {
    const c = getConfig();
    if (!c.owner || !c.repo || !c.token) {
      alert('Please unlock via Passkey or configure GitHub Settings first.');
      return;
    }

    const padName = document.getElementById('padName').value.trim();
    const text = padText.value;
    const duration = parseInt(document.getElementById('expiryDuration').value, 10);
    const unit = document.getElementById('expiryUnit').value;

    if (!padName || !text) {
      alert('Please specify a Pad Name and Content.');
      return;
    }

    try {
      statusEl.innerText = "Encrypting content...";
      const encryptedPayload = await encryptText(text, padName);
      const padHash = await hashName(padName);
      const fileName = `pad_${padHash}.encrypted`;

      statusEl.innerText = "Creating Gist...";
      const gistRes = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${c.token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: `Etherpad: ${padName}`, public: true, files: { [fileName]: { content: encryptedPayload } } })
      });

      if (!gistRes.ok) throw new Error(`Gist Creation Failed: ${gistRes.statusText}`);
      const gistData = await gistRes.json();
      const gistId = gistData.id;

      statusEl.innerText = "Scheduling deletion workflow...";
      const dispatchUrl = `https://api.github.com/repos/${c.owner}/${c.repo}/dispatches`;
      await fetch(dispatchUrl, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${c.token}`, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify({ event_type: 'schedule_gist_deletion', client_payload: { gist_id: gistId, duration: duration, unit: unit } })
      });

      const shareUrl = `${window.location.origin}${window.location.pathname}#${encodeURIComponent(padName)}`;
      window.location.hash = encodeURIComponent(padName);
      statusEl.innerText = `Pad saved! Share Link: ${shareUrl}`;
    } catch (err) {
      statusEl.innerText = `Error: ${err.message}`;
    }
  };

  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(padText.value);
    statusEl.innerText = "Copied to clipboard!";
    setTimeout(() => { statusEl.innerText = "Ready"; }, 2000);
  };

  document.getElementById('newPadBtn').onclick = () => {
    window.location.hash = '';
    window.location.reload();
  };

  // Close settings modal when clicking outside the content box
  window.addEventListener('click', (event) => {
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  });

  initRouter();
</script>
</body>
</html>
